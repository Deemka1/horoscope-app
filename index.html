<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астро-чеклист</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; }
        h1 { font-size: 2rem; margin-bottom: 20px; text-align: center; font-weight: 300; }
        .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .sign-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
        .sign-btn:hover { background: #2a2a2a; border-color: #555; }
        .sign-btn.active { background: #2a2a2a; border-color: #fff; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; color: #888; padding: 10px 15px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #fff; }

        .horoscope-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 25px; margin-top: 10px; }
        .section { margin-bottom: 20px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
        .section-content { font-size: 1.1rem; line-height: 1.5; }
        .meta { font-size: 0.8rem; color: #666; text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #333; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Астро-чеклист</h1>
        <div class="sign-grid" id="signGrid">
            <button class="sign-btn" data-sign="aries">Овен</button>
            <button class="sign-btn" data-sign="taurus">Телец</button>
            <button class="sign-btn" data-sign="gemini">Близнецы</button>
            <button class="sign-btn" data-sign="cancer">Рак</button>
            <button class="sign-btn" data-sign="leo">Лев</button>
            <button class="sign-btn" data-sign="virgo">Дева</button>
            <button class="sign-btn" data-sign="libra">Весы</button>
            <button class="sign-btn" data-sign="scorpio">Скорпион</button>
            <button class="sign-btn" data-sign="sagittarius">Стрелец</button>
            <button class="sign-btn" data-sign="capricorn">Козерог</button>
            <button class="sign-btn" data-sign="aquarius">Водолей</button>
            <button class="sign-btn" data-sign="pisces">Рыбы</button>
        </div>

        <div id="horoscopeCard" class="horoscope-card hidden">
            <div class="tabs">
                <button class="tab-btn active" data-tab="today">Сегодня</button>
                <button class="tab-btn" data-tab="week">Неделя</button>
                <button class="tab-btn" data-tab="month">Месяц</button>
            </div>

            <div id="content-today">
                <div class="section"><div class="section-title">Фокус дня</div><div class="section-content" id="today-focus"></div></div>
                <div class="section"><div class="section-title">Сделать</div><div class="section-content" id="today-do"></div></div>
                <div class="section"><div class="section-title">Избегать</div><div class="section-content" id="today-avoid"></div></div>
            </div>

            <div id="content-week" class="hidden">
                <div class="section"><div class="section-title">Прогноз на неделю</div><div class="section-content" id="week-text"></div></div>
            </div>

            <div id="content-month" class="hidden">
                <div class="section"><div class="section-title">Прогноз на месяц</div><div class="section-content" id="month-text"></div></div>
            </div>

            <div class="meta" id="meta"></div>
        </div>
    </div>

    <script>
        let horoscopeData = null;
        let currentSign = null;

        fetch('horoscope.json')
            .then(r => r.json())
            .then(data => { horoscopeData = data; })
            .catch(err => console.error('Ошибка загрузки:', err));

        // Выбор знака
        document.querySelectorAll('.sign-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSign = btn.dataset.sign;
                document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('horoscopeCard').classList.remove('hidden');
                renderContent('today'); // По умолчанию открываем "Сегодня"
            });
        });

        // Переключение табов
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderContent(tab);
            });
        });

        function renderContent(tab) {
            if (!horoscopeData || !currentSign) return;

            const data = horoscopeData[currentSign];
            const meta = horoscopeData.meta;

            // Скрываем все контентные блоки
            document.getElementById('content-today').classList.add('hidden');
            document.getElementById('content-week').classList.add('hidden');
            document.getElementById('content-month').classList.add('hidden');

            if (tab === 'today') {
                document.getElementById('content-today').classList.remove('hidden');
                document.getElementById('today-focus').textContent = data.today.focus;
                document.getElementById('today-do').textContent = data.today.do;
                document.getElementById('today-avoid').textContent = data.today.avoid;
            } else if (tab === 'week') {
                document.getElementById('content-week').classList.remove('hidden');
                document.getElementById('week-text').textContent = data.week;
            } else if (tab === 'month') {
                document.getElementById('content-month').classList.remove('hidden');
                document.getElementById('month-text').textContent = data.month;
            }

            let retroText = meta.mercury_retrograde ? "⚠️ Меркурий ретроградный" : "✅ Меркурий прямой";
            document.getElementById('meta').textContent = `Луна сегодня: ${meta.moon_sign_today} | Луна завтра: ${meta.moon_sign_tomorrow} | ${retroText} | Обновлено: ${meta.date}`;
        }
    </script>
</body>
</html>
