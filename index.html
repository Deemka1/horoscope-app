<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астро-факты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; font-weight: 300; letter-spacing: 1px; }
        .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .sign-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.85rem; }
        .sign-btn:hover { background: #2a2a2a; border-color: #555; }
        .sign-btn.active { background: #2a2a2a; border-color: #fff; font-weight: bold; }
        .tabs-container { overflow-x: auto; white-space: nowrap; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .tabs { display: inline-flex; gap: 8px; }
        .tab-btn { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 15px; cursor: pointer; font-size: 0.85rem; border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
        .tab-btn:hover { color: #fff; border-color: #555; }
        .tab-btn.active { background: #fff; color: #000; font-weight: bold; border-color: #fff; }
        .horoscope-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; min-height: 300px; }
        .section { margin-bottom: 18px; }
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #888; margin-bottom: 6px; letter-spacing: 1px; }
        .section-content { font-size: 1.05rem; line-height: 1.5; color: #e0e0e0; }
        .astro-fact { background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 0.85rem; color: #aaa; font-family: monospace; }
        .planet-card { background: #252525; border-left: 3px solid #4CAF50; padding: 12px; margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #ccc; }
        .planet-card.venus { border-left-color: #E91E63; }
        .planet-card.mars { border-left-color: #F44336; }
        .date-ref { font-size: 0.8rem; color: #666; text-align: right; margin-bottom: 15px; font-style: italic; }
        .meta { font-size: 0.75rem; color: #555; text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #222; }
        .hidden { display: none; }
        
        /* Стили для формы асцендента */
        .ascendant-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; }
        .ascendant-section h2 { font-size: 1.3rem; margin-bottom: 15px; text-align: center; font-weight: 400; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 5px; }
        .form-group input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        .form-group input:focus { outline: none; border-color: #4CAF50; }
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .calc-btn { width: 100%; background: #4CAF50; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .calc-btn:hover { background: #45a049; }
        .calc-btn:disabled { background: #555; cursor: not-allowed; }
        .ascendant-result { background: #1a1a1a; border: 1px solid #4CAF50; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .ascendant-result h3 { font-size: 1.1rem; margin-bottom: 10px; color: #4CAF50; }
        .ascendant-result p { font-size: 0.95rem; line-height: 1.5; color: #ccc; margin-bottom: 8px; }
        .error-msg { color: #ff6b6b; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Астро-факты</h1>
        <div class="sign-grid">
            <button class="sign-btn" data-sign="aries">Овен</button>
            <button class="sign-btn" data-sign="taurus">Телец</button>
            <button class="sign-btn" data-sign="gemini">Близнецы</button>
            <button class="sign-btn" data-sign="cancer">Рак</button>
            <button class="sign-btn" data-sign="leo">Лев</button>
            <button class="sign-btn" data-sign="virgo">Дева</button>
            <button class="sign-btn" data-sign="libra">Весы</button>
            <button class="sign-btn" data-sign="scorpio">Скорпион</button>
            <button class="sign-btn" data-sign="sagittarius">Стрелец</button>
            <button class="sign-btn" data-sign="capricorn">Козерог</button>
            <button class="sign-btn" data-sign="aquarius">Водолей</button>
            <button class="sign-btn" data-sign="pisces">Рыбы</button>
        </div>

        <div id="horoscopeCard" class="horoscope-card hidden">
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="today">Сегодня</button>
                    <button class="tab-btn" data-tab="tomorrow">Завтра</button>
                    <button class="tab-btn" data-tab="this_week">Эта неделя</button>
                    <button class="tab-btn" data-tab="next_week">След. неделя</button>
                    <button class="tab-btn" data-tab="this_month">Этот месяц</button>
                    <button class="tab-btn" data-tab="next_month">След. месяц</button>
                    <button class="tab-btn" data-tab="this_year">Этот год</button>
                </div>
            </div>

            <div id="loadingMsg" style="text-align: center; color: #888; padding: 40px;">Выберите знак зодиака</div>
            
            <div id="contentArea" class="hidden">
                <div class="date-ref" id="dateRef"></div>
                <div class="astro-fact" id="astroFact"></div>
                <div class="planet-card venus" id="venusCard"></div>
                <div class="planet-card mars" id="marsCard"></div>

                <div class="section"><div class="section-title">Фокус периода</div><div class="section-content" id="content-focus"></div></div>
                <div class="section"><div class="section-title">Рекомендуется</div><div class="section-content" id="content-do"></div></div>
                <div class="section"><div class="section-title">Категорически избегать</div><div class="section-content" id="content-avoid"></div></div>
            </div>

            <div class="meta" id="meta"></div>
        </div>

        <!-- Форма расчета асцендента -->
        <div class="ascendant-section">
            <h2>🔮 Рассчитать Асцендент</h2>
            <div class="form-group">
                <label>Город рождения</label>
                <input type="text" id="cityInput" placeholder="Например: Москва" value="Москва">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>День</label>
                    <input type="number" id="dayInput" min="1" max="31" placeholder="15" value="15">
                </div>
                <div class="form-group">
                    <label>Месяц</label>
                    <input type="number" id="monthInput" min="1" max="12" placeholder="5" value="5">
                </div>
                <div class="form-group">
                    <label>Год</label>
                    <input type="number" id="yearInput" min="1900" max="2030" placeholder="1990" value="1990">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Часы</label>
                    <input type="number" id="hourInput" min="0" max="23" placeholder="14" value="14">
                </div>
                <div class="form-group">
                    <label>Минуты</label>
                    <input type="number" id="minuteInput" min="0" max="59" placeholder="30" value="30">
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="calc-btn" id="calcBtn" onclick="calculateAscendant()">Рассчитать</button>
                </div>
            </div>
            <div id="ascendantResult" class="hidden"></div>
        </div>
    </div>

    <script>
        let horoscopeData = null;
        let currentSign = null;
        let currentTab = 'today';

        fetch('horoscope.json')
            .then(r => r.json())
            .then(data => { 
                horoscopeData = data; 
                const rx = data.meta.current_mercury_rx ? "⚠️ Меркурий ретроградный" : "✅ Меркурий прямой";
                document.getElementById('meta').textContent = `Система на реальных эфемеридах. Луна: ${data.meta.current_moon}. ${rx}.`;
            })
            .catch(err => console.error('Ошибка:', err));

        document.querySelectorAll('.sign-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSign = btn.dataset.sign;
                document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('horoscopeCard').classList.remove('hidden');
                renderContent();
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderContent();
            });
        });

        function renderContent() {
            if (!horoscopeData || !currentSign) return;
            const data = horoscopeData[currentSign][currentTab];
            if (!data) return;

            document.getElementById('loadingMsg').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');
            
            document.getElementById('dateRef').textContent = `Дата расчета: ${data.date_ref}`;
            document.getElementById('astroFact').textContent = data.astro_fact;
            document.getElementById('venusCard').textContent = `♀ Венера: ${data.venus}`;
            document.getElementById('marsCard').textContent = `♂ Марс: ${data.mars}`;
            document.getElementById('content-focus').textContent = data.focus;
            document.getElementById('content-do').textContent = data.do;
            document.getElementById('content-avoid').textContent = data.avoid;
        }

        // Расчет асцендента через Cloudflare Worker
        async function calculateAscendant() {
            const city = document.getElementById('cityInput').value.trim();
            const day = document.getElementById('dayInput').value;
            const month = document.getElementById('monthInput').value;
            const year = document.getElementById('yearInput').value;
            const hour = document.getElementById('hourInput').value || 12;
            const minute = document.getElementById('minuteInput').value || 0;

            if (!city || !day || !month || !year) {
                showAscendantError('Заполните все поля');
                return;
            }

            const btn = document.getElementById('calcBtn');
            const resultDiv = document.getElementById('ascendantResult');
            
            btn.disabled = true;
            btn.textContent = 'Считаем...';
            resultDiv.classList.add('hidden');

            try {
                const url = `https://horoscope-api.fit-for.workers.dev/?city=${encodeURIComponent(city)}&year=${year}&month=${month}&day=${day}&hour=${hour}&minute=${minute}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    showAscendantError(data.error);
                } else {
                    resultDiv.innerHTML = `
                        <div class="ascendant-result">
                            <h3>♈ Асцендент в знаке ${data.ascendant.sign}</h3>
                            <p><strong>Градус:</strong> ${data.ascendant.degree_in_sign}</p>
                            <p><strong>Город:</strong> ${data.city}</p>
                            <p><strong>Координаты:</strong> ${data.coordinates.lat.toFixed(4)}, ${data.coordinates.lon.toFixed(4)}</p>
                            <p style="margin-top: 12px; border-top: 1px solid #333; padding-top: 10px;">${data.interpretation}</p>
                        </div>
                    `;
                    resultDiv.classList.remove('hidden');
                }
            } catch (error) {
                showAscendantError('Ошибка соединения с сервером. Попробуйте позже.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Рассчитать';
            }
        }

        function showAscendantError(message) {
            const resultDiv = document.getElementById('ascendantResult');
            resultDiv.innerHTML = `<div class="error-msg">${message}</div>`;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
