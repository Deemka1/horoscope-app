<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Астро-факты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #000;
            color: #fff; 
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto;
        }
        
        h1 { 
            font-size: 2rem; 
            margin-bottom: 8px; 
            text-align: center; 
            font-weight: 300; 
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .sign-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-bottom: 25px; 
        }
        
        .sign-btn { 
            background: #111;
            border: 1px solid #222;
            color: #fff; 
            padding: 14px 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-size: 0.9rem;
            font-weight: 400;
        }
        
        .sign-btn:hover { 
            background: #1a1a1a;
            border-color: #444;
        }
        
        .sign-btn.active { 
            background: #fff;
            color: #000;
            border-color: #fff;
            font-weight: 500;
        }
        
        .horoscope-card { 
            background: #111;
            border: 1px solid #222;
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 25px;
        }
        
        /* Вкладки в две строки */
        .tabs-container { 
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }
        
        .tabs { 
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        
        .tab-btn { 
            background: transparent;
            border: 1px solid #333;
            color: rgba(255, 255, 255, 0.5); 
            padding: 8px 4px; 
            cursor: pointer; 
            font-size: 0.75rem; 
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 400;
            text-align: center;
        }
        
        .tab-btn:hover { 
            color: #fff;
            border-color: #555;
        }
        
        .tab-btn.active { 
            background: #fff;
            color: #000;
            border-color: #fff;
            font-weight: 500;
        }
        
        .section { margin-bottom: 20px; }
        
        .section-title { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px; 
            letter-spacing: 1px;
            font-weight: 500;
        }
        
        .section-content { 
            font-size: 1rem; 
            line-height: 1.5; 
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }
        
        .astro-fact { 
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            color: rgba(255, 255, 255, 0.7);
            font-family: 'SF Mono', 'Monaco', monospace;
            letter-spacing: 0.3px;
        }
        
        .planet-card { 
            background: #0a0a0a;
            border-left: 2px solid #4CAF50;
            padding: 12px; 
            margin-bottom: 8px; 
            border-radius: 0 8px 8px 0; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.8);
        }
        
        .planet-card.venus { border-left-color: #E91E63; }
        .planet-card.mars { border-left-color: #FF5722; }
        
        .date-ref { 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.3);
            text-align: right; 
            margin-bottom: 15px; 
        }
        
        .meta { 
            font-size: 0.7rem; 
            color: rgba(255, 255, 255, 0.3);
            text-align: center; 
            margin-top: 20px; 
            padding-top: 15px; 
            border-top: 1px solid #222;
        }
        
        .hidden { display: none; }
        
        /* Секция асцендента */
        .ascendant-section { 
            margin-top: 30px; 
            padding-top: 25px; 
            border-top: 1px solid #222;
        }
        
        .ascendant-section h2 { 
            font-size: 1.5rem; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 300;
        }
        
        .form-group { margin-bottom: 15px; }
        
        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .form-group input, .form-group select { 
            width: 100%; 
            background: #111;
            border: 1px solid #222;
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: #fff;
        }
        
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .calc-btn { 
            width: 100%; 
            background: #fff;
            color: #000; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .calc-btn:hover { 
            background: #e0e0e0;
        }
        
        .calc-btn:disabled { 
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        .ascendant-result { 
            background: #111;
            border: 1px solid #222;
            border-radius: 12px; 
            padding: 20px; 
            margin-top: 15px;
        }
        
        .ascendant-result h3 { 
            font-size: 1.2rem; 
            margin-bottom: 12px; 
            font-weight: 400;
        }
        
        .ascendant-result p { 
            font-size: 0.9rem; 
            line-height: 1.5; 
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }
        
        .error-msg { 
            color: #ff4444; 
            text-align: center; 
            padding: 12px;
            font-size: 0.9rem;
        }
        
        .time-toggle { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 15px; 
            padding: 12px; 
            background: #111;
            border-radius: 8px; 
            border: 1px solid #222;
        }
        
        .time-toggle input[type="checkbox"] { 
            width: 18px; 
            height: 18px; 
            cursor: pointer;
        }
        
        .time-toggle label { 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer; 
            margin: 0;
        }
        
        .consent-block { 
            background: #111;
            border: 1px solid #222;
            border-radius: 8px; 
            padding: 12px; 
            margin: 15px 0; 
            display: flex; 
            align-items: flex-start; 
            gap: 10px;
        }
        
        .consent-block input[type="checkbox"] { 
            width: 18px; 
            height: 18px; 
            cursor: pointer;
            margin-top: 2px;
        }
        
        .consent-block label { 
            font-size: 0.8rem; 
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer; 
            line-height: 1.4;
        }
        
        .consent-block a { 
            color: #fff;
            text-decoration: underline;
        }
        
        .disclaimer { 
            font-size: 0.7rem; 
            color: rgba(255, 255, 255, 0.3);
            text-align: center; 
            margin-top: 25px; 
            padding: 15px; 
            border-top: 1px solid #222;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Астро-факты</h1>
        <div class="subtitle">Персональные астрологические расчеты</div>
        
        <div class="sign-grid">
            <button class="sign-btn" data-sign="aries">Овен</button>
            <button class="sign-btn" data-sign="taurus">Телец</button>
            <button class="sign-btn" data-sign="gemini">Близнецы</button>
            <button class="sign-btn" data-sign="cancer">Рак</button>
            <button class="sign-btn" data-sign="leo">Лев</button>
            <button class="sign-btn" data-sign="virgo">Дева</button>
            <button class="sign-btn" data-sign="libra">Весы</button>
            <button class="sign-btn" data-sign="scorpio">Скорпион</button>
            <button class="sign-btn" data-sign="sagittarius">Стрелец</button>
            <button class="sign-btn" data-sign="capricorn">Козерог</button>
            <button class="sign-btn" data-sign="aquarius">Водолей</button>
            <button class="sign-btn" data-sign="pisces">Рыбы</button>
        </div>

        <div id="horoscopeCard" class="horoscope-card hidden">
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="today">Сегодня</button>
                    <button class="tab-btn" data-tab="tomorrow">Завтра</button>
                    <button class="tab-btn" data-tab="this_week">Неделя</button>
                    <button class="tab-btn" data-tab="next_week">След. нед.</button>
                    <button class="tab-btn" data-tab="this_month">Месяц</button>
                    <button class="tab-btn" data-tab="next_month">След. мес.</button>
                    <button class="tab-btn" data-tab="this_year">Год</button>
                </div>
            </div>

            <div id="loadingMsg" style="text-align: center; color: rgba(255,255,255,0.3); padding: 30px;">Выберите знак зодиака</div>
            <div id="contentArea" class="hidden">
                <div class="date-ref" id="dateRef"></div>
                <div class="astro-fact" id="astroFact"></div>
                <div class="planet-card venus" id="venusCard"></div>
                <div class="planet-card mars" id="marsCard"></div>
                <div class="section"><div class="section-title">Фокус периода</div><div class="section-content" id="content-focus"></div></div>
                <div class="section"><div class="section-title">Рекомендуется</div><div class="section-content" id="content-do"></div></div>
                <div class="section"><div class="section-title">Категорически избегать</div><div class="section-content" id="content-avoid"></div></div>
            </div>
            <div class="meta" id="meta"></div>
        </div>

        <div class="ascendant-section">
            <h2>Рассчитать Асцендент</h2>
            <div class="form-group">
                <label>Город рождения</label>
                <input type="text" id="cityInput" placeholder="Например: Москва" value="Москва">
            </div>
            <div class="form-row">
                <div class="form-group"><label>День</label><input type="number" id="dayInput" min="1" max="31" value="15"></div>
                <div class="form-group"><label>Месяц</label><input type="number" id="monthInput" min="1" max="12" value="5"></div>
                <div class="form-group"><label>Год</label><input type="number" id="yearInput" min="1900" max="2030" value="1990"></div>
            </div>
            
            <div class="time-toggle">
                <input type="checkbox" id="approximateTime" onchange="toggleTimeInput()">
                <label for="approximateTime">Не помню точное время, выбрать примерное</label>
            </div>

            <div id="exactTimeBlock">
                <div class="form-row">
                    <div class="form-group"><label>Часы</label><input type="number" id="hourInput" min="0" max="23" value="14"></div>
                    <div class="form-group"><label>Минуты</label><input type="number" id="minuteInput" min="0" max="59" value="30"></div>
                    <div class="form-group"><label>&nbsp;</label><div style="height: 42px;"></div></div>
                </div>
            </div>

            <div id="approximateTimeBlock" class="hidden">
                <div class="form-group">
                    <label>Примерное время рождения</label>
                    <select id="timeOfDay">
                        <option value="09:00">Утро (06:00 - 11:59)</option>
                        <option value="15:00" selected>День (12:00 - 17:59)</option>
                        <option value="21:00">Вечер (18:00 - 23:59)</option>
                        <option value="03:00">Ночь (00:00 - 05:59)</option>
                    </select>
                </div>
            </div>

            <div class="consent-block">
                <input type="checkbox" id="consentCheckbox">
                <label for="consentCheckbox">
                    Я согласен на обработку персональных данных. Данные не хранятся. <a href="privacy.html" target="_blank">Политика</a>
                </label>
            </div>

            <button class="calc-btn" id="calcBtn" onclick="calculateAscendant()">Рассчитать</button>
            <div id="ascendantResult" class="hidden"></div>
        </div>

        <div class="disclaimer">
            Сервис носит развлекательный характер. Астрологические расчеты не являются научно доказанными фактами.
        </div>
    </div>

    <script>
        // Кэш-бастер для Telegram
        const VERSION = '2026.11.09.1';
        
        let horoscopeData = null;
        let currentSign = null;
        let currentTab = 'today';

        fetch('horoscope.json?v=' + VERSION).then(r => r.json()).then(data => { 
            horoscopeData = data; 
            const rx = data.meta.current_mercury_rx ? "⚠️ Меркурий ретроградный" : "✅ Меркурий прямой";
            document.getElementById('meta').textContent = `Луна: ${data.meta.current_moon}. ${rx}.`;
        }).catch(err => console.error('Ошибка:', err));

        document.querySelectorAll('.sign-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSign = btn.dataset.sign;
                document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('horoscopeCard').classList.remove('hidden');
                renderContent();
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderContent();
            });
        });

        function renderContent() {
            if (!horoscopeData || !currentSign) return;
            const data = horoscopeData[currentSign][currentTab];
            if (!data) return;
            document.getElementById('loadingMsg').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');
            document.getElementById('dateRef').textContent = `Дата: ${data.date_ref}`;
            document.getElementById('astroFact').textContent = data.astro_fact;
            document.getElementById('venusCard').textContent = `♀ Венера: ${data.venus}`;
            document.getElementById('marsCard').textContent = `♂ Марс: ${data.mars}`;
            document.getElementById('content-focus').textContent = data.focus;
            document.getElementById('content-do').textContent = data.do;
            document.getElementById('content-avoid').textContent = data.avoid;
        }

        function toggleTimeInput() {
            const isApproximate = document.getElementById('approximateTime').checked;
            const exactBlock = document.getElementById('exactTimeBlock');
            const approxBlock = document.getElementById('approximateTimeBlock');
            
            if (isApproximate) {
                exactBlock.classList.add('hidden');
                approxBlock.classList.remove('hidden');
            } else {
                exactBlock.classList.remove('hidden');
                approxBlock.classList.add('hidden');
            }
        }

        async function calculateAscendant() {
            const consentChecked = document.getElementById('consentCheckbox').checked;
            if (!consentChecked) {
                showAscendantError('Поставьте галочку согласия');
                return;
            }

            const city = document.getElementById('cityInput').value.trim();
            const day = document.getElementById('dayInput').value;
            const month = document.getElementById('monthInput').value;
            const year = document.getElementById('yearInput').value;
            const isApproximate = document.getElementById('approximateTime').checked;
            
            let hour, minute;
            
            if (isApproximate) {
                const timeString = document.getElementById('timeOfDay').value;
                [hour, minute] = timeString.split(':');
            } else {
                hour = document.getElementById('hourInput').value;
                minute = document.getElementById('minuteInput').value;
            }

            if (!city || !day || !month || !year) {
                showAscendantError('Заполните город и дату');
                return;
            }

            const btn = document.getElementById('calcBtn');
            const resultDiv = document.getElementById('ascendantResult');
            
            btn.disabled = true;
            btn.textContent = 'Считаем...';
            resultDiv.classList.add('hidden');

            try {
                const url = `https://astro-calc.fit-for.workers.dev/?city=${encodeURIComponent(city)}&year=${year}&month=${month}&day=${day}&hour=${hour}&minute=${minute}&v=${VERSION}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                
                const data = await response.json();

                if (data.error) {
                    showAscendantError(data.error);
                } else {
                    const timeLabel = isApproximate ? '(примерно)' : '';
                    resultDiv.innerHTML = `
                        <div class="ascendant-result">
                            <h3>Асцендент в знаке ${data.ascendant.sign}</h3>
                            <p><strong>Градус:</strong> ${data.ascendant.degree_in_sign}</p>
                            <p><strong>Время:</strong> ${hour}:${minute} ${timeLabel}</p>
                            <p><strong>Город:</strong> ${data.city}</p>
                            <p style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #222; font-style: italic; color: rgba(255,255,255,0.7);">${data.interpretation}</p>
                        </div>
                    `;
                    resultDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAscendantError('Ошибка соединения');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Рассчитать';
            }
        }

        function showAscendantError(message) {
            const resultDiv = document.getElementById('ascendantResult');
            resultDiv.innerHTML = `<div class="error-msg">${message}</div>`;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
